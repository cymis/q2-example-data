[project]
name = "q2-example-data"
authors = [
    { name = "Adagio Developers" }
]
description = "Curated example datasets for learning Adagio with QIIME 2."
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE" }
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0,<9.0.0",
  "ruff>=0.6.0",
  "nox>=2024.4.15",
  "pyright>=1.1.235,<2.0.0",
  "coverage[toml]>=7.0.0,<8.0.0",
]

[project.entry-points."qiime2.plugins"]
"q2-example-data" = "q2_example_data.plugin_setup:plugin"

[build-system]
requires = ["setuptools>=68", "versioningit", "wheel"]
build-backend = "setuptools.build_meta"

[tool.versioningit.vcs]
method = "git-archive"
describe-subst = "$Format:%(describe)$"
default-tag = "0.0.1"

[tool.versioningit]
default-version = "0.1.0"

[tool.versioningit.next-version]
method = "minor"

[tool.versioningit.format]
distance = "{base_version}+{distance}.{vcs}{rev}"
dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"
distance-dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"

[tool.versioningit.write]
file = "q2_example_data/_version.py"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["q2_example_data*"]

[tool.setuptools.package-data]
q2_example_data = ["**/*"]
